name: Neurarch plan
on: pull_request

permissions:
  contents: write        # lets the bot push the branch its fix lives on
  pull-requests: write   # lets the bot post its plan comment and open the fix pull request

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the bot needs the base commit to trace it and diff
      - uses: neurarch-ai/neurarch-bot@v0
        with:
          fix: true
          # Optional. Without it the bot still tries the exact patch from neurarch-mcp
          # suggest_fix, which costs nothing; the server's proposal source is metered
          # against the key owner's agent quota and is skipped, and the comment says so.
          api-key: ${{ secrets.NEURARCH_API_KEY }}
